server:
  port: 8085

spring:
  application:
    name: commerce-payment

  datasource:
    url: jdbc:mysql://localhost:3306/local_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: app
    password: app1234

  data:
    redis:
      host: localhost
      port: 6379
    jpa:
      database-platform: org.hibernate.dialect.MySQLDialect
      hibernate:
        ddl-auto: none        # DB 초기화 전략 (none, create, create-drop, update, validate)
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQLDialect
          format_sql: true      # 쿼리 로그 포맷 (정렬)
          show_sql: true        # 쿼리 로그 출력
          use_sql_comments: true # 쿼리 로그 주석 사용
          generate_statistics: true
      open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
#      group-id: commerce-order
#      auto-offset-reset: earliest
#      enable-auto-commit: false
#
#      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
#      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.commerce.order.adapter.in.messaging.order.dto.PaymentResultEvent
        spring.json.use.type.headers: false

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    topic:
      payment-result: payment-result
      order-status-changed: order-status-changed
      payment-cancel: payment-cancel

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment-cancel:
  outbox:
    scheduler:
      fixed-delay-ms: 1000
      batch-size: 100
      stale-publishing-seconds: 60
    retry:
      max-count: 5
      base-delay-seconds: 10
      max-delay-seconds: 600
    publish-timeout-ms: 3000

order-status:
  outbox:
    scheduler:
      fixed-delay-ms: 1000
      batch-size: 100
      stale-publishing-seconds: 60
    retry:
      max-count: 5
      base-delay-seconds: 10
      max-delay-seconds: 600
    publish-timeout-ms: 3000

payment-lock:
  wait-seconds: 3

payment-cancel-recovery:
  fixed-delay-ms: 5000
  stale-seconds: 60
  batch-size: 50
  max-retry-count: 10

logging:
  level:
    com.commerce.order.adapter.out.client: DEBUG